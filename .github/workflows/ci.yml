name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked --workspace --doc
      - name: Verify crate packaging
        run: cargo publish --workspace --locked --dry-run --registry crates-io
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 integration/navidrome/test-prepare.py
      - name: Synthetic Navidrome integration
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          make -C integration/navidrome test-rust DOCKER_COMPOSE="docker compose"
