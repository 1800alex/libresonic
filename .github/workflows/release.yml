name: Publish Crate
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          version = manifest["workspace"]["package"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Release tag must match workspace version v{version}")
          PY
      - name: Verify publishable workspace
        run: cargo publish --workspace --locked --dry-run --registry crates-io
      - name: Publish to Crates.io
        run: cargo publish --workspace --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
