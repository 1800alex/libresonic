[package]
name = "libresonic-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Bounded MP3, FLAC and M4A single-track decoding and neutral PCM transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
rand = "0.9"
libresonic-core = { path = "../libresonic-core" }
# Same decoder already used by Sonicfast; no audio device or GUI dependencies.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "alac", "isomp4"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
